<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="img/logo.png">
  <meta name="theme-color" content="#fbf8f0">
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=20261013a">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body data-page="{{page}}">
  <a class="skip" href="#main">跳到內容</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="./">
        <img src="img/logo.png" alt="" width="44" height="44">
        <span class="brand-name">書槑子青年坊</span>
      </a>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav"><span class="nav-burger" aria-hidden="true"></span>選單</button>
    </div>
    <nav class="site-nav" id="site-nav" aria-label="主選單">
      <div class="wrap nav-row">
          {{nav}}
      </div>
    </nav>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="wave" aria-hidden="true"></div>
    <div class="wrap footer-grid">
      <div>
        <p class="footer-brand"><img src="img/logo.png" alt="" width="36" height="36"> 書槑子青年坊</p>
        <p class="muted">讀書會 × 活動 × 課程 × 志工<br>把迷惘變成方向、把壓力變成力量。</p>
      </div>
      <div class="footer-links">
        <a class="btn btn-line" href="https://lin.ee/auCgNDI" target="_blank" rel="noopener">💬 書槑子青年坊官方 LINE</a>
        <a class="btn btn-line" href="https://line.me/ti/g2/54nufHfVxf8vBencGmHK4fvJH408_CUpuOEWIA" target="_blank" rel="noopener">🌿 植素園 HAPPY 購（團購社群）</a>
      </div>
    </div>
    <p class="wrap copyright">© 書槑子青年坊</p>
  </footer>

  <script src="js/config.js?v=20261013a"></script>
  <script src="js/live.js?v=20261013a"></script>
  <script src="js/nav.js?v=20261013a"></script>
</body>
</html>
